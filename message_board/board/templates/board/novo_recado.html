{% extends "board/base.html" %}
{% block title %}Novo recado | Mural{% endblock %}
{% block content %}
<main class="form-page">
    <h1 class="visually-hidden">Adicionar recado</h1>
    <form class="surface message-form" action="{% url 'message_create' %}" method="post">
        {% csrf_token %}
        {% if error %}
            <p class="form-alert" role="alert">{{ error }}</p>
        {% endif %}
        <div class="form-field">
            <label class="form-label" for="author">Autor</label>
            <input class="form-control" type="text" id="author" name="author"
                   maxlength="100" required value="{{ author }}" placeholder="Seu nome"
                   autocomplete="name">
        </div>
        <div class="form-field">
            <label class="form-label" for="message">Recado</label>
            <textarea class="form-control form-control--message" id="message" name="content"
                      required placeholder="Seu recado">{{ content }}</textarea>
        </div>
        <div class="form-actions">
            <button class="button" type="submit">Enviar</button>
        </div>
    </form>
    <a class="button button--small form-back" href="{% url 'message_list' %}">Voltar ao mural</a>
</main>
{% endblock %}
