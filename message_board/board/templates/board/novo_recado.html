<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Recado</title>
</head>
<body>

    <h1>Insira aqui o seu recado:</h1>
    <div class="add-message-form">
        <form action="{% url 'message_create' %}" method="post">
            {% csrf_token %}
            <div>
                <label for="author">Autor:</label>
                <input type="text" id="author" name="author" maxlength="100" required>
            </div>

            <div>
                <label for="message">Mensagem:</label>
                <textarea id="message" name="content" required></textarea>
            </div>

            <div class="button">
                <button type="submit">Enviar</button>
            </div>
        </form>
    </div>
    
    <div class="confirm-submission">
        
        {% if author or content %}
            <h3>Dados recebidos</h3>
            <p>Author: {{ author }}</p>
            <p>Mensagem:</p>
            <p>{{ content }}</p>
        {% endif %}
        
    </div>

    <a href="{% url 'message_list' %}">Voltar</a>
</body>
</html>
